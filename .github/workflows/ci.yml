name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Build pipeline offline (loads seed + dbt build, no network)
        run: python -m scripts.refresh --skip-network

      - name: Sanity-check the marts exist
        run: |
          python - <<'PY'
          import duckdb
          from pipeline.db import WAREHOUSE
          con = duckdb.connect(str(WAREHOUSE), read_only=True)
          n = con.execute("select count(*) from main.mart_platform_status").fetchone()[0]
          assert n > 0, "mart_platform_status is empty"
          print(f"OK: {n} platforms in mart_platform_status")
          PY
