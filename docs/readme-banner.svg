<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="AI Eval Job Radar">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#12102a"/>
      <stop offset="100%" stop-color="#0d1b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#33d69f"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#33d69f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="920" height="220" rx="18" fill="url(#bg)"/>
  <rect x="-200" y="0" width="240" height="220" rx="18" fill="url(#shimmer)" opacity="0.9">
    <animate attributeName="x" values="-240;920" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="918" height="218" rx="17" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <circle cx="72" cy="102" r="7" fill="#58a6ff">
    <animate attributeName="r" values="7;9;7" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="118" r="7" fill="#33d69f">
    <animate attributeName="r" values="7;9;7" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="102" r="7" fill="#58a6ff">
    <animate attributeName="r" values="7;9;7" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <path d="M79 102 H89 M103 110 L113 104" stroke="#33d69f" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="20;0;20" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="170" y="92" fill="#f8fbff" font-family="Segoe UI, system-ui, sans-serif" font-size="38" font-weight="800">AI Eval Job Radar</text>
  <text x="170" y="126" fill="#9db4d1" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="500">Self-updating directory of AI evaluation, training, and annotation platforms — DuckDB + dbt + Streamlit.</text>
  <rect x="170" y="148" width="88" height="28" rx="14" fill="rgba(188,140,255,0.14)" stroke="#58a6ff66" stroke-width="1">
    <animate attributeName="opacity" values="1;0.75;1" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="214" y="167" fill="#58a6ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AI EVAL</text>
  <rect x="270" y="148" width="96" height="28" rx="14" fill="rgba(188,140,255,0.14)" stroke="#33d69f66" stroke-width="1">
    <animate attributeName="opacity" values="1;0.75;1" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="318" y="167" fill="#33d69f" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STREAMLIT</text>
</svg>